status:
  scope: >-
    Six theorems are compared (lean/comparator/config.json): erL_four
    (L(4) = 16), erL_five_bounds (49 ≤ L(5) ≤ 65), lift_lemma (Lemma 4.1 of
    the paper), le_erL_of_groupPartition (Corollary 4.2), le_sdeg_blockSums
    (Theorem 4.1 of Eliahou and Revuelta, with ramseyBound k in place of
    R_k(3)) and erL_le (the upper bound of their Proposition 5.3, with the
    same bound). The bound L(5) ≤ 61 of the paper is not formalized. The
    remarks and the computer checks of the paper are not formalized.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

