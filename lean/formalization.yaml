        review by GPT of commit 89ec343.
  notes: >-
    The author directed the work, has checked the content and takes
    responsibility for it.

fidelity:
  divergences: >-
    Natural numbers are the ambient type: sets are subsets of ℕ and
    sequences are lists of natural numbers. For a subset of the positive
    integers the Schur degree is the same in ℕ and in ℤ. The Schur degree
    sdeg X takes values in ℕ∞ and is ⊤ when no finite cover exists. erL n
    is defined for every n; Eliahou and Revuelta define L(n) for n ≥ 2. The
    average of the empty sequence is 0; erL uses only lengths L > 0.
    ramseyBound k (ramseyBound 0 = 2, ramseyBound (k + 1) =
    (k + 1)(ramseyBound k − 1) + 2) is the pigeonhole upper bound for
    R_k(3) and replaces R_k(3) in le_sdeg_blockSums and erL_le;
    ramseyBound 3 = 17 = R_3(3) and ramseyBound 4 = 66, so the Lean upper
    bound for L(5) is 65, not 61. In lift_lemma the sequence is given by its
    prefix sums. The paper, Section 7, lists the formal statements.

