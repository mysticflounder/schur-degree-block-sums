# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "The Schur degree of block sums: L(4) = 16 and L(5) ≥ 49"
  description: >-
    A Lean 4 formalization, with Mathlib, of the main results of the paper
    "The Schur degree of block sums: L(4) = 16 and L(5) ≥ 49"
    (paper/schur-degree-block-sums.md in this repository). Eliahou and
    Revuelta (Discrete Math. 344 (2021) 112332) defined a number L(n) through
    the Schur degree of the set of block sums of a sequence of positive
    integers, proved S(n−1) + 1 ≤ L(n) ≤ R_{n−1}(3) − 1 and S(n) ≤ n·L(n),
    and conjectured L(n) = S(n−1) + 1 (their Conjecture 5.6), that is,
    L(4) = 14 and L(5) = 45. The formalization proves L(4) = 16 (erL_four),
    49 ≤ L(5) ≤ 65 (erL_five_bounds), the lift that turns a cover of the
    nonzero elements of ZMod m₁ × ZMod m₂ by q sets that are sumfree in the
    group into a sequence whose block sums have Schur degree at most q
    (lift_lemma), its corollary m₁m₂ ≤ L(n) (le_erL_of_groupPartition), and
    Theorem 4.1 and the upper bound of Proposition 5.3 of Eliahou and
    Revuelta, with the pigeonhole bound ramseyBound k in place of R_k(3)
    (le_sdeg_blockSums, erL_le). So Conjecture 5.6 is false for n = 4 and
    n = 5. The Lean upper bound for L(5) is 65, not the bound 61 of the
    paper: the formalization uses the pigeonhole bound R₄(3) ≤ 66 and not
    the bound R₄(3) ≤ 62 of Fettes, Kramer and Radziszowski. The finite
    checks use the Lean kernel (decide), with no native code. The sequence
    W, the lift, the proofs, the programs and the Lean formalization were
    produced with the AI system Claude (Anthropic; model Claude Opus 5.5)
    under the direction of the author.
  authors:
    - "Adam McKenna"
  responsible_maintainers:
    - "Adam McKenna"
  license: "Apache-2.0"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05D10", "11B75", "05C55"]

sources:
  - title: "The Schur degree of block sums: L(4) = 16 and L(5) ≥ 49 (preprint; paper/schur-degree-block-sums.md in this repository)"
    authors: ["Adam McKenna"]
    id: "https://doi.org/10.5281/zenodo.22987189"
    type: paper
    relationship: formalizes
    note: >-
      The compared theorems erL_four, erL_five_bounds (its lower bound),
      lift_lemma and le_erL_of_groupPartition formalize Theorem 1.1
      (L(4) = 16), the bound L(5) ≥ 49 of Theorem 1.2, Lemma 4.1 (the lift)
      and Corollary 4.2 of this paper. These four results are new results of
      the paper, and the paper is their first presentation. The paper and
      the Lean formalization were written together: both are in the first
      commit (21df780) of this repository. The upper bound L(5) ≤ 61 of
      Theorem 1.2 is not formalized; erL_five_bounds has the upper bound 65
      from the adapted Proposition 5.3 of Eliahou and Revuelta (next entry).
      Section 7 of the paper describes the formalization. Its Section 8
      records the literature check: no work after Eliahou and Revuelta
      (2021) on L(n) or on their Conjectures 5.6 to 5.8 was found, and the
      citation databases Crossref, OpenAlex, OpenCitations and Semantic
      Scholar list no work that cites it (September 2026). The paper is a
      preprint on Zenodo, without peer review.
  - title: "The Schur degree of additive sets"
    authors: ["Shalom Eliahou", "M. P. Revuelta"]
    id: "https://doi.org/10.1016/j.disc.2021.112332"
    type: paper
    relationship: adapts
    note: >-
      Discrete Math. 344(5) (2021) 112332. The compared theorems
      le_sdeg_blockSums and erL_le formalize their Theorem 4.1 (if
      |A| ≥ R_q(3) − 1, then the set of block sums of A has Schur degree at
      least q + 1) and the upper bound L(n) ≤ R_{n−1}(3) − 1 of their
      Proposition 5.3, with the pigeonhole bound ramseyBound k ≥ R_k(3) in
      place of R_k(3). So the Lean statements are weaker than theirs. The
      upper bounds L(4) ≤ 16 and L(5) ≤ 65 in erL_four and erL_five_bounds
      come from these adapted results (ramseyBound 3 = 17, ramseyBound 4 =
      66). The paper is also the source of the definitions (sumfree sets,
      covers by sumfree sets, the Schur degree, block sums and L(n)) and of
      Conjecture 5.6, which the repository paper refutes at n = 4 and
      n = 5.
  - title: "The Schur degree of additive sets (preprint)"
    authors: ["Shalom Eliahou", "M. P. Revuelta"]
    id: "https://arxiv.org/abs/2006.01502v1"
    type: paper
    relationship: background
    note: "The arXiv preprint (2020) of the paper above."
  - title: "Combinatorial relations and chromatic graphs"
    authors: ["R. E. Greenwood", "A. M. Gleason"]
    id: "https://doi.org/10.4153/CJM-1955-001-4"
    type: paper
    relationship: background
    note: >-
      Canad. J. Math. 7 (1955) 1–7. The paper uses R_3(3) = 17 from it in
      the proof of L(4) ≤ 16. The formalization does not use this result:
      it proves the pigeonhole bound ramseyBound 3 = 17 for R_3(3) itself.
      The paper also cites it for partitions of finite groups into sumfree
      sets as Ramsey colourings.
  - title: "An upper bound of 62 on the classical Ramsey number R(3,3,3,3)"
    authors: ["S. E. Fettes", "R. L. Kramer", "S. P. Radziszowski"]
    type: paper
    relationship: background
    note: >-
      Ars Combin. 72 (2004) 41–63. With the bound of Eliahou and Revuelta,
      R_4(3) ≤ 62 gives L(5) ≤ 61 in the paper. The formalization does not
      use it; its upper bound for L(5) is 65.
  - title: "A problem of Schur and its generalizations"
    authors: ["H. L. Abbott", "D. Hanson"]
    id: "https://doi.org/10.4064/aa-20-2-175-187"
    type: paper
    relationship: background
    note: >-
      Acta Arith. 20(2) (1972) 175–187. Cited by the paper for partitions
      of finite groups into sumfree sets as Ramsey colourings.
  - title: "A counterexample on a group partitioning problem"
    authors: ["C. S. Anabanti"]
    id: "https://eprints.bbk.ac.uk/id/eprint/26765"
    type: paper
    relationship: background
    note: >-
      Birkbeck Mathematics Preprint Series, Preprint No. 37 (2017). Cited by
      the paper for partitions of finite groups into sumfree sets as Ramsey
      colourings.
  - title: "The Ramsey number R_4(3) is not solvable by group partition means"
    authors: ["C. S. Anabanti"]
    id: "https://doi.org/10.56415/qrs.v31.12"
    type: paper
    relationship: background
    note: >-
      Quasigroups Related Systems 31(2) (2023) 165–174. Cited by the paper
      for partitions of finite groups into sumfree sets as Ramsey
      colourings.

