name: comparator

# Comparator gate for the Lean library (the Eliahou–Revuelta number L(n):
# L(4) = 16, 49 ≤ L(5) ≤ 65, and four general theorems).
#
# The package is lean/comparator/ (ClassicalChallenge, ClassicalSolution,
# config.json, axiom-audit.lean, check-conformance.sh, verify-comparator.sh).
#
# Steps:
#   source requirements — scripts/check-lean-sources.py: every Lean file
#                 begins with the module header keyword and has at most
#                 10,000 lines (the source requirements of the Palomar
#                 Registry).
#   conformance — lean/comparator/check-conformance.sh builds the two
#                 modules; each listed theorem's axiom closure is a subset of
#                 {propext, Classical.choice, Quot.sound}.
#   comparator  — lean/comparator/verify-comparator.sh runs the
#                 `lake comparator` of the project's own toolchain
#                 (lean/lean-toolchain) in its bubblewrap sandbox: statement
#                 identity (with every definition that the statements use),
#                 axiom compliance, and kernel replay by Lean's kernel and by
#                 the toolchain's bundled kernels nanoda and con-ron. Nothing
#                 that judges is built from a pin.

on:
  push:
    branches: [master, main]
    paths:
      - 'lean/**'
      - 'scripts/**'
      - '.github/workflows/comparator.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparator:
    name: conformance + lake comparator (Lean kernel, nanoda, con-ron)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)
        with:
          persist-credentials: false

      - name: Check Lean source requirements before builds
        run: python3 scripts/check-lean-sources.py

      - name: Install the toolchain of lean/lean-toolchain, fetch the Mathlib cache, build
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: lean

      - name: Print toolchain
        working-directory: lean
        run: |
          echo "lean-toolchain: $(cat lean-toolchain)"
          lean --version
          lake --version

      - name: Build ClassicalChallenge + ClassicalSolution, run axiom audit
        run: lean/comparator/check-conformance.sh

      - name: Install bubblewrap for lake comparator's sandbox
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
        # which `bwrap` needs for the sandbox; the runner is disposable.
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run the toolchain's lake comparator on the six ClassicalSchurClaims theorems
        run: lean/comparator/verify-comparator.sh
